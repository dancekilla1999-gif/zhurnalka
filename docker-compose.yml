# Локальный Postgres 17 для тестов. Боевую базу Supabase не используем.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zhurnalka
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zhurnalka"]
      interval: 5s
      timeout: 5s
      retries: 20
