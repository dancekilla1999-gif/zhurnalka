name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zhurnalka
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zhurnalka"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/zhurnalka
      IP_SALT: ci-ip-salt
      REFRESH_GRACE_KEY: ci-grace-key
      TG_SESSION_SECRET: ci-session-secret-value
      TG_BOT_TOKEN: 5990001111:AAHtestTokenForUnitTestsOnly00000
      TG_BOT_USERNAME: trio_zhurnalka_bot
      CRON_SECRET: ci-cron-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

  acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zhurnalka
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zhurnalka"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/zhurnalka
      IP_SALT: ci-ip-salt
      REFRESH_GRACE_KEY: ci-grace-key
      TG_SESSION_SECRET: ci-session-secret-value
      TG_BOT_TOKEN: ${{ secrets.TG_TEST_BOT_TOKEN }}
      TG_BOT_USERNAME: trio_zhurnalka_bot
      CRON_SECRET: ci-cron-secret
      REQUIRE_REAL_INITDATA: "1"
      TG_REAL_INITDATA: ${{ secrets.TG_REAL_INITDATA }}
      TG_REAL_INITDATA_TESTDC: ${{ secrets.TG_REAL_INITDATA_TESTDC }}
      TG_TEST_BOT_TOKEN: ${{ secrets.TG_TEST_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: tests with tap reporter
        run: node --test --test-concurrency=1 | tee test-out.txt
      - name: no skipped tests
        run: grep -q '# skipped 0' test-out.txt
